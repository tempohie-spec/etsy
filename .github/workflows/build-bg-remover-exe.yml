name: Build bg-remover exe

on:
  workflow_dispatch:
  push:
    paths:
      - "bg-remover/**"
      - ".github/workflows/build-bg-remover-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: bg-remover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt onnxruntime pyinstaller
      - run: pyinstaller --onefile --windowed --name BackgroundRemover --collect-all onnxruntime --collect-data certifi app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BackgroundRemover-windows
          path: bg-remover/dist/BackgroundRemover.exe
      # Link tai truc tiep co dinh, luon tro toi ban build moi nhat:
      # https://github.com/<owner>/<repo>/releases/download/bg-remover-latest/BackgroundRemover.exe
      - name: Publish latest exe as a release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bg-remover-latest --cleanup-tag --yes || true
          gh release create bg-remover-latest dist/BackgroundRemover.exe \
            --title "Background Remover (latest build)" \
            --notes "Auto build from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" --latest=false
